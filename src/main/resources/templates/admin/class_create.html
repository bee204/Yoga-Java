<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo lớp học Yoga mới - VITA Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-shell.css}">
    <link rel="stylesheet" th:href="@{/css/readability.css}">
</head>
<body class="admin-body">
    <div th:replace="~{layouts/admin_nav :: admin_nav}"></div>

    <main class="admin-main" style="max-width: 800px; margin: 30px auto; padding: 0 20px;">
        <div style="margin-bottom: 20px;">
            <a th:href="@{/admin/classes}" style="color: #10372f; text-decoration: none; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách lớp
            </a>
        </div>

        <div style="background: white; border-radius: 14px; padding: 35px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); border: 1px solid #e2ece9;">
            <h1 style="color: #10372f; font-size: 22px; margin-top: 0; margin-bottom: 25px;">Tạo lớp học Yoga mới</h1>

            <form method="POST" th:action="@{/admin/classes/create}">
                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Tên lớp học *</label>
                    <input type="text" name="name" required placeholder="Ví dụ: Hatha Yoga Cân Bằng" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px;">
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Giáo viên phụ trách *</label>
                        <select name="teacher_id" required style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                            <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.name}">GV</option>
                        </select>
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Lịch học *</label>
                        <input type="text" name="lich_hoc" required placeholder="Thứ 2 - Thứ 4 - Thứ 6" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px;">
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Giờ bắt đầu *</label>
                        <input type="time" name="start_time" required value="06:00" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Giờ kết thúc *</label>
                        <input type="time" name="end_time" required value="07:15" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px;">
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Ngày khai giảng *</label>
                        <input type="date" name="start_date" required th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Ngày kết thúc *</label>
                        <input type="date" name="end_date" required th:value="${#temporals.format(#temporals.createNow().plusMonths(3), 'yyyy-MM-dd')}" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px;">
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Sĩ số tối đa *</label>
                        <input type="number" name="quantity" required value="20" min="1" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Học phí (VNĐ / tháng) *</label>
                        <input type="number" name="price" required value="500000" step="10000" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                </div>

                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Địa điểm / Phòng học</label>
                    <input type="text" name="location" placeholder="Ví dụ: Phòng Sen Vàng - Tầng 2" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Mô tả nội dung lớp học</label>
                    <textarea name="description" rows="3" placeholder="Giới thiệu về nội dung, đối tượng phù hợp..." style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px; font-family: inherit;"></textarea>
                </div>

                <button type="submit" style="background: #10372f; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;">
                    <i class="fa-solid fa-plus"></i> Tạo lớp học
                </button>
            </form>
        </div>
    </main>
</body>
</html>
