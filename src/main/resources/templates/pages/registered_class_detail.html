<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${class.name + ' - Đánh giá lớp học'}">Đánh giá lớp học</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/classes.css}">
    <link rel="stylesheet" th:href="@{/css/login-chooser.css}">
    <link rel="stylesheet" th:href="@{/css/readability.css}">
</head>
<body>
    <div th:replace="~{components/header :: header}"></div>

    <main>
        <div class="container" style="padding: 40px 0; max-width: 700px;">
            <div th:if="${success}" class="alert alert-success" style="background:#d4edda;color:#155724;padding:12px;margin:15px 0;border-radius:6px;">
                <i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-error" style="background:#f8d7da;color:#721c24;padding:12px;margin:15px 0;border-radius:6px;">
                <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
            </div>

            <div style="margin-bottom: 20px;">
                <a th:href="@{/registered-classes}" style="color: #10372f; text-decoration: none; font-weight: 600;">
                    <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách lớp đã đăng ký
                </a>
            </div>

            <div style="background: white; border-radius: 16px; padding: 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2ece9; margin-bottom: 30px;">
                <span style="color: #2e7d32; font-weight: 600; text-transform: uppercase; font-size: 13px;">Lớp học đang tham gia</span>
                <h1 th:text="${class.name}" style="color: #10372f; margin: 8px 0 15px 0; font-size: 26px;">Tên lớp</h1>
                <p style="color: #666; font-size: 14px; margin: 0 0 10px 0;">
                    <i class="fa-regular fa-calendar"></i> Lịch học: <strong th:text="${class.lichHoc}">T2-T4-T6</strong> | 
                    <i class="fa-regular fa-clock"></i> Khung giờ: <strong th:text="${class.startTime + ' - ' + class.endTime}">06:00</strong>
                </p>
                <p style="color: #666; font-size: 14px; margin: 0;">
                    <i class="fa-solid fa-location-dot"></i> Địa điểm: <strong th:text="${class.location}">Phòng Sen Vàng</strong>
                </p>
            </div>

            <!-- Review Card -->
            <div style="background: white; border-radius: 16px; padding: 35px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2ece9;">
                <h2 style="color: #10372f; margin-top: 0; font-size: 20px;">Đánh giá & Cảm nhận về khóa học</h2>
                
                <form method="POST" th:action="@{'/registered-classes/' + ${class.id} + '/review'}">
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 8px;">Xếp hạng số sao</label>
                        <select name="rating" style="padding: 10px; border: 1px solid #cce3de; border-radius: 8px; width: 100%; max-width: 220px; font-size: 15px;">
                            <option value="5" th:selected="${review != null and review.rating == 5}">⭐⭐⭐⭐⭐ (5 sao - Rất hài lòng)</option>
                            <option value="4" th:selected="${review != null and review.rating == 4}">⭐⭐⭐⭐ (4 sao - Hài lòng)</option>
                            <option value="3" th:selected="${review != null and review.rating == 3}">⭐⭐⭐ (3 sao - Bình thường)</option>
                            <option value="2" th:selected="${review != null and review.rating == 2}">⭐⭐ (2 sao - Chưa tốt)</option>
                            <option value="1" th:selected="${review != null and review.rating == 1}">⭐ (1 sao - Rất tệ)</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 25px;">
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 8px;">Ý kiến đóng góp / Chia sẻ cảm nhận</label>
                        <textarea name="comment" rows="4" th:text="${review != null ? review.comment : ''}" placeholder="Giáo viên nhiệt tình, bài tập vừa sức, không gian sạch sẽ..." style="width: 100%; padding: 12px; border: 1px solid #cce3de; border-radius: 8px; font-family: inherit; font-size: 14px;"></textarea>
                    </div>

                    <button type="submit" style="background: #10372f; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-star"></i> <span th:text="${review != null ? 'Cập nhật đánh giá' : 'Gửi đánh giá'}">Gửi đánh giá</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{components/footer :: footer}"></div>
</body>
</html>
