<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập tài khoản - VITA Yoga</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/readability.css}">
</head>
<body class="auth-page-body">
    <div th:replace="~{components/header :: header}"></div>

    <main>
        <div class="container">
            <section class="auth-page">
                <div class="auth-shell">
                    <aside class="auth-intro">
                        <div class="auth-intro__brand">
                            <span><i class="fa-solid fa-leaf" aria-hidden="true"></i></span>VITA
                        </div>
                        <div class="auth-intro__content">
                            <p class="auth-intro__eyebrow">Chào mừng trở lại</p>
                            <h1>Tiếp tục hành trình sống khỏe của bạn.</h1>
                            <p>Theo dõi lớp học, lịch tập và tiến độ của bạn trong một không gian duy nhất.</p>
                        </div>
                        <div class="auth-intro__note">
                            <i class="fa-solid fa-shield-heart" aria-hidden="true"></i>
                            <span><strong>An toàn & riêng tư</strong><small>Thông tin tài khoản của bạn luôn được bảo vệ.</small></span>
                        </div>
                    </aside>

                    <div class="auth-form-panel">
                        <div class="auth-form-heading">
                            <span class="auth-form-icon"><i class="fa-solid fa-user" aria-hidden="true"></i></span>
                            <div>
                                <p>Tài khoản thành viên</p>
                                <h2>Đăng nhập</h2>
                            </div>
                        </div>

                        <div th:if="${error}" class="auth-alert" role="alert">
                            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                            <span th:text="${error}"></span>
                        </div>
                        <div th:if="${success}" class="auth-alert" style="background:#e8f5e9;color:#2e7d32;" role="alert">
                            <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                            <span th:text="${success}"></span>
                        </div>

                        <form id="loginForm" method="POST" th:action="@{/account/login}" class="auth-form">
                            <div class="auth-field">
                                <label for="email">Email hoặc Tên đăng nhập</label>
                                <div class="auth-input-wrap">
                                    <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                                    <input type="text" id="email" name="email" required autocomplete="username" placeholder="student1 hoặc ban@example.com" autofocus>
                                </div>
                            </div>
                            <div class="auth-field">
                                <label for="password">Mật khẩu</label>
                                <div class="auth-input-wrap">
                                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Nhập mật khẩu">
                                    <button type="button" class="password-toggle" aria-label="Hiện mật khẩu" onclick="togglePassword(this, 'password')">
                                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="auth-submit">
                                <span>Đăng nhập</span>
                                <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                            </button>
                        </form>
                        <p class="auth-register-link">
                            Chưa có tài khoản? <a th:href="@{/account/register}">Tạo tài khoản mới</a>
                        </p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{components/footer :: footer}"></div>

    <script>
    function togglePassword(button, inputId) {
        const input = document.getElementById(inputId);
        if (!input) return;
        const isVisible = input.type === 'text';
        input.type = isVisible ? 'password' : 'text';
        button.setAttribute('aria-label', isVisible ? 'Hiện mật khẩu' : 'Ẩn mật khẩu');
        button.setAttribute('aria-pressed', isVisible ? 'false' : 'true');
        button.querySelector('i').className = isVisible ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    }
    </script>
</body>
</html>
