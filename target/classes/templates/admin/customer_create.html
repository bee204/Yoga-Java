<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm học viên mới - VITA Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-shell.css}">
    <link rel="stylesheet" th:href="@{/css/readability.css}">
</head>
<body class="admin-body">
    <div th:replace="~{layouts/admin_nav :: admin_nav}"></div>

    <main class="admin-main" style="max-width: 800px; margin: 30px auto; padding: 0 20px;">
        <div style="margin-bottom: 20px;">
            <a th:href="@{/admin/customers}" style="color: #10372f; text-decoration: none; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Danh sách học viên
            </a>
        </div>

        <div style="background: white; border-radius: 14px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); border: 1px solid #e2ece9;">
            <h1 style="color: #10372f; margin: 0 0 8px 0; font-size: 22px;">Tạo hồ sơ học viên mới</h1>
            <p style="color: #64748b; font-size: 14px; margin: 0 0 25px 0;">Điền thông tin liên hệ và cá nhân của học viên.</p>

            <form th:action="@{/admin/customers/create}" method="POST">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
                    <div style="grid-column: span 2;">
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Họ và tên *</label>
                        <input type="text" name="name" required placeholder="Ví dụ: Nguyễn Văn A" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;">
                    </div>

                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Số điện thoại *</label>
                        <input type="tel" name="phone" required placeholder="0901234567" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;">
                    </div>

                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Email</label>
                        <input type="email" name="email" placeholder="hocvien@email.com" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;">
                    </div>

                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Ngày sinh</label>
                        <input type="date" name="birthday" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;">
                    </div>

                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Giới tính</label>
                        <select name="gender" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;">
                            <option value="">Chọn giới tính</option>
                            <option value="male">Nam</option>
                            <option value="female">Nữ</option>
                        </select>
                    </div>

                    <div style="grid-column: span 2;">
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Địa chỉ</label>
                        <input type="text" name="address" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;">
                    </div>

                    <div style="grid-column: span 2;">
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Ghi chú nội bộ</label>
                        <textarea name="note" rows="3" placeholder="Ghi chú về thể lực, lưu ý sức khỏe..." style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;"></textarea>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 25px;">
                    <a th:href="@{/admin/customers}" style="background: #f1f5f9; color: #475569; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600;">Hủy bỏ</a>
                    <button type="submit" style="background: #10372f; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-plus"></i> Lưu học viên
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
