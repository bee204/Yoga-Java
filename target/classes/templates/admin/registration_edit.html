<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Chỉnh sửa đơn #' + ${registration.id} + ' - VITA Admin'">Chỉnh sửa đơn đăng ký - VITA Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-shell.css}">
    <link rel="stylesheet" th:href="@{/css/readability.css}">
</head>
<body class="admin-body">
    <div th:replace="~{layouts/admin_nav :: admin_nav}"></div>

    <main class="admin-main" style="max-width: 900px; margin: 30px auto; padding: 0 20px;">
        <div style="margin-bottom: 20px;">
            <a th:href="@{'/admin/registrations/' + ${registration.id}}" style="color: #10372f; text-decoration: none; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Chi tiết đơn đăng ký
            </a>
        </div>

        <div style="background: white; border-radius: 14px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); border: 1px solid #e2ece9;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px;">
                <div>
                    <h1 style="color: #10372f; margin: 0 0 5px 0; font-size: 22px;" th:text="'Chỉnh sửa đơn #' + ${registration.id}">Chỉnh sửa đơn #1</h1>
                    <p style="color: #64748b; font-size: 14px; margin: 0;">Điều chỉnh lớp học, gói học hoặc ghi chú cho đơn đăng ký.</p>
                </div>
                <div>
                    <span th:if="${registration.status == 'CONFIRMED'}" style="background: #dcfce7; color: #166534; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px;">Đã duyệt</span>
                    <span th:if="${registration.status == 'PENDING'}" style="background: #fef3c7; color: #d97706; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px;">Chờ duyệt</span>
                    <span th:if="${registration.status == 'CANCELLED'}" style="background: #fee2e2; color: #991b1b; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px;">Đã hủy</span>
                </div>
            </div>

            <form th:action="@{'/admin/registrations/' + ${registration.id} + '/edit'}" method="POST" id="adminEditRegForm">
                <div style="background: #f8fafc; border-radius: 10px; padding: 16px; margin-bottom: 25px; border: 1px solid #e2e8f0;">
                    <strong style="color: #334155; font-size: 14px; display: block; margin-bottom: 4px;">Thông tin học viên:</strong>
                    <div style="color: #10372f; font-weight: 600;" th:text="${registration.customer != null ? registration.customer.name : 'Chưa có thông tin'}">Nguyễn Văn A</div>
                    <small style="color: #64748b;" th:text="${registration.customer != null ? (registration.customer.phone + ' · ' + registration.customer.email) : ''}">0900000000</small>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 25px;">
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Lớp Yoga *</label>
                        <select name="class_id" id="classSelect" required style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;">
                            <option th:each="cls : ${classes}" th:value="${cls.id}" th:selected="${cls.id == registration.classId}" th:data-price="${cls.price}" th:text="${cls.name + ' - ' + #numbers.formatDecimal(cls.price, 0, 'POINT', 0, 'COMMA') + 'đ/tháng'}"></option>
                        </select>
                    </div>

                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Trạng thái đơn</label>
                        <select name="status" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;">
                            <option value="CONFIRMED" th:selected="${registration.status == 'CONFIRMED'}">Đã duyệt (CONFIRMED)</option>
                            <option value="PENDING" th:selected="${registration.status == 'PENDING'}">Chờ duyệt (PENDING)</option>
                            <option value="CANCELLED" th:selected="${registration.status == 'CANCELLED'}">Đã hủy (CANCELLED)</option>
                        </select>
                    </div>
                </div>

                <h3 style="color: #10372f; font-size: 16px; margin: 0 0 15px 0;">Thời hạn gói học</h3>
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px;">
                    <label style="border: 2px solid #e2ece9; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer;">
                        <input type="radio" name="package_months" value="1" th:checked="${registration.packageMonths == 1}" style="margin-bottom: 6px;">
                        <strong style="display: block; color: #10372f; font-size: 15px;">1 Tháng</strong>
                        <small style="color: #64748b;">Gói cơ bản</small>
                    </label>
                    <label style="border: 2px solid #e2ece9; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer;">
                        <input type="radio" name="package_months" value="3" th:checked="${registration.packageMonths == 3}" style="margin-bottom: 6px;">
                        <strong style="display: block; color: #10372f; font-size: 15px;">3 Tháng</strong>
                        <small style="color: #16a34a; font-weight: 600;">Giảm 5%</small>
                    </label>
                    <label style="border: 2px solid #e2ece9; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer;">
                        <input type="radio" name="package_months" value="6" th:checked="${registration.packageMonths == 6}" style="margin-bottom: 6px;">
                        <strong style="display: block; color: #10372f; font-size: 15px;">6 Tháng</strong>
                        <small style="color: #16a34a; font-weight: 600;">Giảm 10%</small>
                    </label>
                    <label style="border: 2px solid #e2ece9; border-radius: 10px; padding: 14px; text-align: center; cursor: pointer;">
                        <input type="radio" name="package_months" value="12" th:checked="${registration.packageMonths == 12}" style="margin-bottom: 6px;">
                        <strong style="display: block; color: #10372f; font-size: 15px;">12 Tháng</strong>
                        <small style="color: #16a34a; font-weight: 600;">Giảm 15%</small>
                    </label>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px;">Ghi chú</label>
                    <textarea name="note" rows="2" placeholder="Ghi chú thêm..." style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; box-sizing: border-box;" th:text="${registration.note}"></textarea>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <a th:href="@{'/admin/registrations/' + ${registration.id}}" style="background: #f1f5f9; color: #475569; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600;">Hủy bỏ</a>
                    <button type="submit" style="background: #10372f; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;">
                        <i class="fa-solid fa-check"></i> Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
