<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm giáo viên mới - VITA Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin-shell.css}">
    <link rel="stylesheet" th:href="@{/css/readability.css}">
</head>
<body class="admin-body">
    <div th:replace="~{layouts/admin_nav :: admin_nav}"></div>

    <main class="admin-main" style="max-width: 700px; margin: 30px auto; padding: 0 20px;">
        <div style="margin-bottom: 20px;">
            <a th:href="@{/admin/teachers}" style="color: #10372f; text-decoration: none; font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách giáo viên
            </a>
        </div>

        <div style="background: white; border-radius: 14px; padding: 35px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); border: 1px solid #e2ece9;">
            <h1 style="color: #10372f; font-size: 22px; margin-top: 0; margin-bottom: 25px;">Thêm giáo viên Yoga mới</h1>

            <form method="POST" th:action="@{/admin/teachers/create}">
                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Họ và tên *</label>
                    <input type="text" name="name" required placeholder="Nguyễn Văn A" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px;">
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Số điện thoại *</label>
                        <input type="tel" name="phone" required placeholder="0901234567" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Email *</label>
                        <input type="email" name="email" required placeholder="gv@vitayoga.vn" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px;">
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Ngày sinh</label>
                        <input type="date" name="birthday" value="1995-01-01" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Số năm kinh nghiệm</label>
                        <input type="number" name="exp_year" value="3" min="0" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                    </div>
                </div>

                <div style="margin-bottom: 18px;">
                    <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Tên file ảnh đại diện (trong img/authors/)</label>
                    <select name="avatar" style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px;">
                        <option value="tu.jpg">tu.jpg (Cẩm Tú)</option>
                        <option value="huong.jpg">huong.jpg (Thu Hương)</option>
                        <option value="luc.jpg">luc.jpg (Trọng Lực)</option>
                        <option value="hieu.jpg">hieu.jpg (Trung Hiếu)</option>
                        <option value="hung.jpg">hung.jpg (Huy Năng)</option>
                    </select>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-weight: 600; color: #10372f; margin-bottom: 6px;">Mô tả / Tiểu sử</label>
                    <textarea name="description" rows="3" placeholder="Chứng chỉ RYT 200, chuyên ngành Hatha..." style="width: 100%; padding: 11px; border: 1px solid #cce3de; border-radius: 8px; font-family: inherit;"></textarea>
                </div>

                <button type="submit" style="background: #10372f; color: white; padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;">
                    <i class="fa-solid fa-plus"></i> Thêm giáo viên
                </button>
            </form>
        </div>
    </main>
</body>
</html>
